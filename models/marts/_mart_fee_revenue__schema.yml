models:
  - name: mart_fee_revenue
    config:
      contract:
        enforced: true
    columns:
      - name: invoice_id
        data_type: VARCHAR
        data_tests:
          - unique
          - not_null
      - name: client_id
        data_type: VARCHAR
      - name: service_id
        data_type: VARCHAR
      - name: invoice_date
        data_type: DATE
      - name: source_extract_timestamp
        data_type: TIMESTAMP
      - name: billing_period_start
        data_type: DATE
      - name: billing_period_end
        data_type: DATE
      - name: fee_amount_eur
        data_type: DOUBLE
      - name: fee_basis
        data_type: VARCHAR
      - name: is_paid
        data_type: BOOLEAN
      - name: fee_line_type
        data_type: VARCHAR
      - name: billing_period_label
        data_type: VARCHAR
      - name: service_name
        data_type: VARCHAR
      - name: pns_column_name
        data_type: VARCHAR

semantic_models:
  - name: sem_fee_revenue
    model: ref('mart_fee_revenue')
    defaults:
      agg_time_dimension: billing_period_start
    entities:
      - name: client_id
        type: primary
    dimensions:
      - name: billing_period_start
        type: time
        type_params:
          time_granularity: month
      - name: service_id
        type: categorical
      - name: billing_period_label
        type: categorical
      - name: fee_basis
        type: categorical
      - name: fee_line_type
        type: categorical
      - name: is_paid
        type: categorical
    measures:
      - name: gross_fee_amount
        agg: sum
        expr: fee_amount_eur
        filter: "{{ Dimension('fee_line_type') }} = 'invoice'"
      - name: net_fee_amount
        agg: sum
        expr: fee_amount_eur
      - name: invoice_count
        agg: count
        expr: invoice_id
      - name: credit_note_count
        agg: count
        expr: invoice_id
        filter: "{{ Dimension('fee_line_type') }} = 'credit_note'"

metrics:
  - name: gross_mrr
    type: simple
    description: Monthly recurring gross fee revenue — invoices only, before credit note adjustments
    type_params:
      measure: gross_fee_amount
  - name: net_mrr
    type: simple
    description: Monthly recurring net fee revenue — gross fees net of all credit note adjustments
    type_params:
      measure: net_fee_amount
  - name: credit_note_ratio
    type: ratio
    description: Share of invoice lines reversed by credit notes, which is quality signal for billing accuracy
    type_params:
      numerator:
        measure: credit_note_count
      denominator:
        measure: invoice_count
